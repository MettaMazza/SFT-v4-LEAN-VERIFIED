name: Verify Lean and V3 correspondence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SFT_V3_SOURCE: ${{ github.workspace }}/_v3
    steps:
      - name: Check out formalisation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned V3 evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MettaMazza/ernos-labs-sft-platform
          ref: 76f1b34e9e9682989adcbb088797b4ae4ce4fcf1
          path: _v3
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sft/foundation/
            /sft/mathematics/exact_arithmetic/law.py
            /sft/mathematics/discrete_mathematics/law.py
            /sft/mathematics/generated_law.py
            /claims/SFT-MATH-EXACT-ARITHMETIC-001/
            /sft/engine/canonical.py
            /sft/engine/engine.py
            /sft/engine/model.py
            /claims/SFT-ROOT-THERE-IS-NO-NOTHING/
            /claims/SFT-FOUNDATION-ONE-001/
            /claims/SFT-FOUNDATION-COUNT-001/
            /claims/SFT-FOUNDATION-PART-001/
            /claims/SFT-FOUNDATION-PART-EQUIVALENCE-001/
            /claims/SFT-FOUNDATION-FOLD-001/
            /claims/SFT-FOUNDATION-FOLD-ASSEMBLY-001/
            /claims/SFT-FOUNDATION-EXACT-OPERATIONS-001/
            /claims/SFT-FOUNDATION-HALF-ONE-001/
            /claims/SFT-FOUNDATION-FOLD-DYNAMICS-001/
            /claims/SFT-FOUNDATION-FORM-GRAMMAR-001/
            /claims/SFT-FOUNDATION-FORM-ENFORCEMENT-001/
            /claims/SFT-FOUNDATION-MEASURED-VALUE-BOUNDARY-001/
      - name: Install verified official pinned Lean release
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          mkdir -p verification/current "$RUNNER_TEMP/sft-lean"
          archive="$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --retry-delay 2 -fL https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$archive"
          printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$archive" | sha256sum --check | tee verification/current/TOOLCHAIN_DIGEST.log
          tar --zstd -xf "$archive" --strip-components=1 -C "$RUNNER_TEMP/sft-lean"
          echo "$RUNNER_TEMP/sft-lean/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sft-lean/bin/lean" --version | tee verification/current/TOOLCHAIN_VERSION.log
      - name: Fresh build, complete declaration audit and candidate parity
        run: python3 verification/check_current_parity.py
      - name: Fresh Root evidence, SHA256 and canonical JSON checks
        run: python3 verification/check_root_evidence.py
      - name: Typed forcing gate and Root tampering checks
        run: python3 verification/check_decision_gate.py
      - name: Closure and control gate checks
        run: python3 verification/check_evidence_gates.py
      - name: Census gate and Root census tampering checks
        run: python3 verification/check_census_gate.py
      - name: Registration constraints and source identity checks
        run: python3 verification/check_registration_gate.py
      - name: Count proposal classification and source correspondence
        run: python3 verification/check_count_representation.py
      - name: Common-refinement construction and pairing checks
        run: python3 verification/check_common_refinement.py
      - name: Fold controls and finite assembly construction
        run: python3 verification/check_fold_construction.py
      - name: Complete Fold assembly stage and return traces
        run: python3 verification/check_assembly_trace.py
      - name: Concrete proposed assembly supports
        run: python3 verification/check_assembly_support.py
      - name: Assembly controls and finite-set correspondence
        run: python3 verification/check_assembly_controls.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-verification-${{ github.sha }}
          path: verification/current/
          if-no-files-found: error
